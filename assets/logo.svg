<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- M Symbol Glow Gradient -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Arrow Render Spark Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Round App Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="6" />

  <!-- Outer Glass Frame Ring -->
  <rect x="40" y="40" width="432" height="432" rx="88" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="4" />

  <!-- Main Markdown M Symbol with Smooth Curvature -->
  <g filter="url(#glow)">
    <!-- Left Column -->
    <path d="M 124 350 V 170 C 124 156 138 146 150 154 L 236 216 C 248 224 264 224 276 216 L 362 154 C 374 146 388 156 388 170 V 350 C 388 362 378 372 366 372 C 354 372 344 362 344 350 V 220 L 276 270 C 264 278 248 278 236 270 L 168 220 V 350 C 168 362 158 372 146 372 C 134 372 124 362 124 350 Z" fill="url(#mGrad)" />
  </g>

  <!-- Render Down Arrow (Symbolizing Markdown Conversion & Rendering) -->
  <path d="M 330 310 L 370 350 L 410 310" fill="none" stroke="url(#arrowGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Render Sparkle Accent -->
  <path d="M 390 120 L 396 136 L 412 142 L 396 148 L 390 164 L 384 148 L 368 142 L 384 136 Z" fill="#fde047" />
  <path d="M 130 110 L 134 120 L 144 124 L 134 128 L 130 138 L 126 128 L 116 124 L 126 120 Z" fill="#38bdf8" />
</svg>
